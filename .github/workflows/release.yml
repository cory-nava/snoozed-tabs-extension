name: Release

# Push a tag matching manifest.json's version (e.g. v1.1.0) to publish a GitHub Release
# with the ZIP people download and load unpacked.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Fails if the tag doesn't match the version in manifest.json and package.json
      - run: npm run package

      # Run the end-to-end tests against exactly what's being shipped
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          EXTENSION_DIR: ${{ github.workspace }}/dist/snoozed-tabs

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes are this version's section of CHANGELOG.md
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" "dist/snoozed-tabs-${TAG#v}.zip" --title "Snoozed Tabs ${TAG#v}" --notes-file notes.md
